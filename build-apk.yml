name: Build APK
on: {workflow_dispatch: {}}
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - name: Prepare project
        run: |
          mkdir -p web
          cp index.html extras.js firebase-config.js manifest.json sw.js icon.svg icon-192.png icon-512.png web/
          echo '{"name":"namaz-tasks","version":"1.0.0","private":true,"dependencies":{"@capacitor/core":"^6.2.0","@capacitor/android":"^6.2.0","@capacitor/app-launcher":"^6.0.0","@capacitor/browser":"^6.0.0","@capacitor/local-notifications":"^6.0.0","@capacitor-community/speech-recognition":"^6.0.0","@capacitor-community/background-geolocation":"^1.2.0"},"devDependencies":{"@capacitor/cli":"^6.2.0"}}' > package.json
          echo '{"appId":"com.namaz.tasks","appName":"Namaz & Tasks","webDir":"web"}' > capacitor.config.json
      - run: npm install
      - run: npx cap add android
      - name: Add permissions
        run: |
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          names='ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION ACCESS_BACKGROUND_LOCATION RECORD_AUDIO CAMERA MODIFY_AUDIO_SETTINGS READ_CONTACTS FOREGROUND_SERVICE FOREGROUND_SERVICE_LOCATION POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM USE_EXACT_ALARM RECEIVE_BOOT_COMPLETED VIBRATE WAKE_LOCK'.split()
          perm=''.join('<uses-permission android:name="android.permission.%s"/>'%x for x in names)
          q='<queries><intent><action android:name="android.speech.RecognitionService"/></intent></queries>'
          s=s.replace('<application',perm+q+'<application',1)
          open(p,'w').write(s)
          PY
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: namaz-tasks-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
